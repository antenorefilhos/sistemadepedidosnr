server {
    listen 80;
    server_name localhost;

    # JON-105 (Auditoria 360, Medium): proxy_pass com hostname literal
    # resolve o DNS UMA vez, ao carregar a config -- se a API for recriada
    # (novo container, IP novo na rede Docker), o proxy antigo continua
    # mandando pro IP velho ate reload/restart manual, produzindo 502 em
    # silencio. resolver + variavel forca nginx a resolver de novo a cada
    # requisicao (cache de 10s), acompanhando a rede Docker sem reload.
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    # JON-150 (Auditoria 360): sem X-Frame-Options/CSP, uma pagina de outra
    # origem podia enquadrar o app operacional (clickjacking). nginx NAO
    # herda add_header de um nivel pai numa location que ja define seu
    # proprio add_header -- por isso os headers abaixo se repetem em cada
    # location que tem Cache-Control proprio, nao so aqui no server{}.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
    gzip_comp_level 6;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream http://api:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
