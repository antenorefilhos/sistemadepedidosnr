server {
    listen 80;
    server_name localhost;

    # JON-105 (Auditoria 360, Medium): proxy_pass com hostname literal
    # resolve o DNS UMA vez, ao carregar a config -- se a API for recriada
    # (novo container, IP novo na rede Docker), o proxy antigo continua
    # mandando pro IP velho ate reload/restart manual, produzindo 502 em
    # silencio. resolver + variavel forca nginx a resolver de novo a cada
    # requisicao (cache de 10s), acompanhando a rede Docker sem reload.
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE [1-6]\.";
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level   9;

    # Security Headers
    # JON-150 (Auditoria 360): nginx nao herda add_header de um nivel pai
    # numa location que ja define o proprio add_header -- por isso os
    # mesmos headers se repetem na location de assets estaticos abaixo.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para a API — funciona de qualquer IP/dispositivo
    location /api/ {
        set $api_upstream http://api:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Sem essa location exata, "/api/uploads" (sem barra no final -- o que o
    # axios do admin manda pra criar upload) cai na location de baixo
    # (^~ /api/uploads/, pensada pra SERVIR arquivo ja enviado) e o nginx
    # devolve 301 pra acrescentar a barra. O axios nao segue redirect em
    # POST multipart -- o navegador so reporta "sem conexao com o servidor".
    # Achado 13/09/2026 tentando subir foto de banner.
    location = /api/uploads {
        set $api_upstream http://api:3001/uploads;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    location ^~ /api/uploads/ {
        set $api_upstream http://api:3001;
        rewrite ^/api/uploads/(.*)$ /uploads/$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    # JON-105 (Auditoria 360, Medium): proxy_pass com hostname literal
