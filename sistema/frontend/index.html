<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/branding/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Antenor & Filhos - Qualidade e Tradição em cada item" />
    <title>Antenor & Filhos Mercado</title>
    <!-- NAO REMOVER: verificacao do Google Search Console (propriedade https://mercado.antenorefilhos.com.br/, metodo Tag HTML, 28/09/2026). Sem ela a propriedade perde a verificacao. -->
    <meta name="google-site-verification" content="UqsoNn55VAw6t4iGThDKaYLbsFD5qtzUAVHz9XfV-w4" />

    <!-- Open Graph / compartilhamento (WhatsApp, Telegram, Facebook...): esses
         crawlers NAO rodam JavaScript, entao as tags do SEO.tsx (react-helmet,
         so aplicadas no navegador) nunca chegam neles -- so o HTML estatico
         daqui conta. Achado em 23/09/2026: faltavam por completo, o preview
         caia no <title> cru ("Premium Shopping") sem imagem nenhuma. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Antenor & Filhos" />
    <meta property="og:title" content="Antenor & Filhos Mercado" />
    <meta property="og:description" content="Qualidade e Tradição em cada item. Açougue, Adega e Padaria Artesanal, com entrega rápida." />
    <meta property="og:image" content="https://mercado.antenorefilhos.com.br/branding/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:url" content="https://mercado.antenorefilhos.com.br" />
    <meta name="twitter:card" content="summary" />

    <!-- Preconnect: fonts e API -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- 08/10/2026: a conexao com a API (e com o banco de fotos do banner
         principal) abre enquanto o JavaScript baixa; antes so abria quando a
         Home pedia os dados, ~1 s depois no 4G. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Performance hints -->
    <meta name="theme-color" content="#5D082A" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
