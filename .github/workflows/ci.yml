name: Mercado Antenor CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Job 1: Backend (build + unit tests) ───────────────────────
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: antenor
          POSTGRES_PASSWORD: antenor123
          POSTGRES_DB: antenor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://antenor:antenor123@localhost:5432/antenor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
      # Achado em 17/09/2026, primeira vez que o CI real rodou (JON-100 so
      # tinha corrigido o job "docker" abaixo, nao este) -- specs que
      # constroem OrderOrchestrationService direto (ex.: pedido-obs.spec.ts)
      # estouram no construtor via requireEnv(). Diferente do job "docker"
      # (so smoke test HTTP, valor sintetico serve), aqui varios specs de
      # order-orchestration.service.spec.ts fazem toHaveBeenCalledWith
      # hardcoded contra CNPJ/CODECOM reais (ex.: codEcom: 19) -- um valor
      # sintetico generico ("1"/"00000000000000") faz o teste falhar por
      # DIVERGENCIA de expectativa, nao por falta de env. CNPJ e' publico
      # (rodape do site, ver CLAUDE.md "identificador que autentica...");
      # CODECOM e' so codigo interno do Solidcom, nao e segredo.
      SOLIDCOM_CNPJ: "5147995000131"
      SOLIDCOM_CODECOM: "19"
      SOLIDCOM_BALCAO_CPF: "00000000000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sistema/backend/package-lock.json

      - name: Install backend deps
        working-directory: sistema/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: sistema/backend
        run: npx prisma generate

      - name: Run migrations (test DB)
        working-directory: sistema/backend
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: sistema/backend
        run: npm run build

      - name: Unit tests
        working-directory: sistema/backend
        run: npm run test -- --passWithNoTests

  # ── Job 2: Storefront (build) ─────────────────────────────────
  storefront:
    name: Storefront — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sistema/frontend/package-lock.json

      - name: Install deps
        working-directory: sistema/frontend
        run: npm ci

      - name: Build
        working-directory: sistema/frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

  # ── Job 3: Admin (build) ──────────────────────────────────────
  admin:
    name: Admin — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sistema/admin/package-lock.json

      - name: Install deps
        working-directory: sistema/admin
        run: npm ci

      - name: Build
        working-directory: sistema/admin
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

  # ── Job: Picking app (build) ──────────────────────────────────
  # JON-67 (Auditoria 360, Medium): picking/delivery e Notificador nunca
  # rodavam no CI -- erro de tipo ou teste quebrado ali so aparecia com o
  # deploy real, sem guardrail de PR.
  # picking-app e delivery-app viraram workspace npm (JON-66) --
  # @antenor/push-client e symlinkado a partir do lockfile em sistema/, entao
  # o install roda na raiz do workspace, nao no app isolado.
  picking-app:
    name: Picking app — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sistema/package-lock.json

      - name: Install deps (workspace)
        working-directory: sistema
        run: npm ci

      - name: Typecheck + build
        working-directory: sistema
        run: npm run build --workspace=picking-app

  # ── Job: Delivery app (build) ─────────────────────────────────
  delivery-app:
    name: Delivery app — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sistema/package-lock.json

      - name: Install deps (workspace)
        working-directory: sistema
        run: npm ci

      - name: Typecheck + build
        working-directory: sistema
        run: npm run build --workspace=delivery-app

  # ── Job: Notificador (testes puros, sem Electron nem DORSAL real) ──
  notificador:
    name: Notificador — testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Notificador/package-lock.json

      - name: Install deps
        working-directory: Notificador
        run: npm ci

      - name: Testes (escalation, faturamento, dorsal)
        working-directory: Notificador
        run: npm test

  # ── Job 4: Docker smoke test (apenas em push para main) ───────
  docker:
    name: Docker — compose build
    runs-on: ubuntu-latest
    needs: [backend, storefront, admin]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        working-directory: sistema
        run: docker compose build

      # Achado em 17/09/2026: sistema/certs/ e' gitignored de proposito
      # (certificado self-signed local, usado so pra testar no iPhone via
      # LAN) -- sem ele, nginx do storefront/admin recusa iniciar (ssl_
      # certificate apontando pra arquivo ausente derruba o processo
      # INTEIRO, HTTP incluido, nao so a porta 443). Mesmo problema bateria
      # em qualquer dev que nunca gerou esse certificado. Gera descartavel
      # so pra passar o smoke test.
      - name: Gerar certificado self-signed descartavel (sistema/certs/)
        working-directory: sistema
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/key.pem -out certs/cert.pem \
            -subj "/CN=localhost"

      - name: Start stack and health check
        working-directory: sistema
        # JON-100 (Auditoria 360): faltava SOLIDCOM_BALCAO_CPF/CNPJ/CODECOM --
        # docker-compose.yml resolve pra string vazia sem eles, e
        # OrderOrchestrationService le por requireEnv() no construtor (boot
        # incondicional): a API nunca chegava no /health, o gate falhava
        # antes do smoke test rodar. Valores sinteticos, nunca reais/producao.
        # JWT_SECRET curto (14 chars) tambem nunca passaria o check de
        # sistema/backend/src/common/security/jwt-secret.ts (min 32 chars);
        # o valor abaixo e so pra este job, nao serve em nenhum outro lugar.
        #
        # Achado em 17/09/2026: SOLIDCOM_API_URL faltava tambem --
        # SolidcomERPService.requireEnv() no construtor estourava do mesmo
        # jeito, so que o erro ficava mudo por um bug separado no logger (ver
        # common/nest-winston-logger.ts) -- container so reiniciava em loop
        # sem log util nenhum ate corrigir os dois.
        env:
          DATABASE_URL: postgresql://antenor:antenor123@db:5432/antenor
          POSTGRES_USER: antenor
          POSTGRES_PASSWORD: antenor123
          POSTGRES_DB: antenor
          REDIS_URL: redis://redis:6379
          JWT_SECRET: ci-smoke-secret-sintetico-32-chars-minimo-para-passar-no-check
          SOLIDCOM_API_URL: http://solidcom-sintetico-ci.invalid
          SOLIDCOM_CNPJ: "00000000000000"
          SOLIDCOM_CODECOM: "1"
          SOLIDCOM_BALCAO_CPF: "00000000000"
        run: |
          docker compose up -d
          sleep 15
          curl -f http://localhost:3001/health || (docker compose logs api && exit 1)
          curl -f http://localhost:3000 || (docker compose logs storefront && exit 1)
          curl -f http://localhost:3002 || (docker compose logs admin && exit 1)

      # Achado em 17/09/2026: este job nunca rodava migrate/seed no banco da
      # stack (diferente do test-pr.yml "e2e-critical", que ja fazia isso) --
      # /health passa porque nao toca no Prisma de verdade, mas o guardrail
      # abaixo consulta tabelas de categoria que nao existem num banco recem
      # criado, e sempre falhava com 500 generico.
      - name: Migrations + seed
        working-directory: sistema
        run: |
          docker compose exec -T api npx prisma migrate deploy
          docker compose exec -T api npx prisma db seed

      - name: Pending contract guardrail
        working-directory: sistema
        run: docker compose exec -T api node /app/scripts/validate-pending-contract.js

      - name: Tear down
        if: always()
        working-directory: sistema
        run: docker compose down -v
